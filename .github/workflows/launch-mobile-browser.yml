name: PairVoice Mobile Browser Simulation
on:
  workflow_dispatch:
  pull_request:
    branches: [v2.5-auth-rebased-20261011, phase-2-production-workflow]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run two-session mobile browser simulation
        run: node scripts/launch-browser-simulation.mjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pairvoice-mobile-simulation
          path: test-results/browser/
          if-no-files-found: warn
