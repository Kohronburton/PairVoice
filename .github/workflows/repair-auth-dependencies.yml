name: Repair dependency audit on auth branch
on:
  push:
    branches: [v2.5-auth-guardrails]
    paths: [.github/workflows/repair-auth-dependencies.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm audit fix --omit=dev
      - run: npm audit --omit=dev --audit-level=high
      - name: Commit audited dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Resolve production dependency security advisories"
            git push origin HEAD:v2.5-auth-guardrails
          fi
