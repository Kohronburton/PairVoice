name: Build & Test — coming-soon

on:
  push:
    branches:
      - coming-soon
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
