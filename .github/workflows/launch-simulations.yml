name: Launch simulation smoke
on:
  pull_request:
    branches: [phase-2-production-workflow]
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Staging URL only; no production or real payouts'
        required: false
        default: 'https://staging.pairvoice.com'
jobs:
  http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAIRVOICE_TEST_BASE_URL: ${{ inputs.staging_url || 'https://staging.pairvoice.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only HTTP checks
        run: node scripts/launch-http-smoke.mjs
