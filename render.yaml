services:
  - type: web
    name: pairvoice
    runtime: node
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PAIRVOICE_EMAIL_FROM
        value: PairVoice <hello@pairvoice.com>
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: PAIRVOICE_ADMIN_USER
        sync: false
      - key: PAIRVOICE_ADMIN_PASSWORD
        sync: false
      - key: PAIRVOICE_INTERNAL_SECRET
        sync: false
      - key: PAIRVOICE_OWNER_EMAIL
        sync: false
      - key: PAYPAL_MODE
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false

  - type: web
    name: pairvoice-staging
    runtime: node
    branch: phase-2-production-workflow
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PAIRVOICE_EMAIL_FROM
        value: PairVoice <hello@pairvoice.com>
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: PAIRVOICE_ADMIN_USER
        sync: false
      - key: PAIRVOICE_ADMIN_PASSWORD
        sync: false
      - key: PAIRVOICE_INTERNAL_SECRET
        sync: false
      - key: PAIRVOICE_OWNER_EMAIL
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false

  - type: cron
    name: pairvoice-revenue-worker
    runtime: node
    branch: main
    schedule: "*/5 * * * *"
    buildCommand: echo worker-ready
    startCommand: node scripts/run-revenue-workers.mjs
    envVars:
      - key: PAIRVOICE_SITE_URL
        value: https://pairvoice.onrender.com
      - key: PAIRVOICE_INTERNAL_SECRET
        sync: false
